<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Internship Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 16px;
            background: linear-gradient(
                135deg,
                #172554 0%,
                #312e81 50%,
                #7c3aed 100%
            );
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorative circles */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            top: -100px;
            right: -80px;
        }

        body::after {
            width: 260px;
            height: 260px;
            bottom: -100px;
            left: -70px;
        }

        /* Login card */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 22px;
            box-shadow: 0 25px 70px rgba(10, 15, 50, 0.30);
            position: relative;
            z-index: 1;
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            width: 66px;
            height: 66px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: linear-gradient(135deg, #312e81, #7c3aed);
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        h1 {
            text-align: center;
            color: #172554;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.7px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        /* Error and success messages */
        .error-message,
        .success-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .success-message {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #24304f;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dbe2ef;
            border-radius: 10px;
            background: #f8fafc;
            color: #172554;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s,
                        background 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        /* Sign In button */
        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 7px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(100deg, #312e81, #7c3aed);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(124, 58, 237, 0.22);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 24px rgba(124, 58, 237, 0.30);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Registration section */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0 20px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .register-text {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        .link {
            color: #6d28d9;
            font-weight: 700;
            text-decoration: none;
        }

        .link:hover {
            color: #4c1d95;
            text-decoration: underline;
        }

        .footer {
            margin-top: 27px;
            text-align: center;
            color: #94a3b8;
            font-size: 10px;
            line-height: 1.6;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 32px 23px;
                border-radius: 18px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                width: 58px;
                height: 58px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">IT</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Sign in to your Internship &amp; Package<br>
            Tracking Management System
        </p>

        <div id="errorMessage"
             class="error-message"
             role="alert"></div>

        <div id="successMessage"
             class="success-message"
             role="status"></div>

        <!-- Existing login servlet is preserved -->
        <form action="login" method="post">

            <div class="form-group">

                <label for="semail">Email Address</label>

                <input
                    type="email"
                    id="semail"
                    name="semail"
                    maxlength="150"
                    placeholder="Enter your registered email"
                    autocomplete="username"
                    required>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>

            <button type="submit" class="login-button">
                Sign In &rarr;
            </button>

        </form>

        <div class="divider">
            NEW TO INTERNSHIP TRACKER?
        </div>

        <p class="register-text">
            Don't have an account?
            <a class="link" href="Register.html">
                Create an Account
            </a>
        </p>

        <div class="footer">
            Internship &amp; Package Tracking Management System
        </div>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        const error = params.get("error");
        const registered = params.get("registered");

        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        const errorMessages = {
            empty: "Please enter your email address and password.",
            invalid: "Invalid email or password. Please try again.",
            passwordnotset:
                "Password is not set for this account. Please contact the administrator.",
            server: "Something went wrong. Please try again later."
        };

        if (error && errorMessages[error]) {
            errorMessage.textContent = errorMessages[error];
            errorMessage.style.display = "block";
        }

        if (registered === "success") {
            successMessage.textContent =
                "Registration successful! Please log in.";

            successMessage.style.display = "block";
        }
    </script>

</body>
</html>
